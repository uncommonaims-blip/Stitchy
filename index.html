<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stitchy — Evolution</title><style>html,body{margin:0;background:#090d17;color:#eaf1ff;font:16px system-ui}main{max-width:960px;margin:auto;padding:14px}h1{margin:4px 0 8px}canvas{width:100%;aspect-ratio:16/9;background:#050505;border:2px solid #65738c;border-radius:12px;touch-action:none}button{touch-action:none;user-select:none;-webkit-user-select:none;background:#283b60;color:white;border:1px solid #8199c9;border-radius:9px;padding:12px 18px;font-size:16px;margin:5px}#controls{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px auto 16px}#controls button{margin:0;min-height:72px;min-width:76px;font-size:24px;font-weight:700;touch-action:none}#controls #jump{min-width:112px;background:#315b81;font-size:19px}#controls #fly{min-width:88px;background:#326453;display:none;font-size:17px}#controls #fly.available{display:block}#controls button:active,#controls button.pressed{background:#5480bb;transform:scale(.97)}#settings{display:flex;justify-content:center;flex-wrap:wrap}#hud{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}small{color:#aebbd0}</style></head><body><main><h1>STITCHY <small>— evolution prototype</small></h1><div id="hud"><span id="stage"></span><span id="score"></span><span id="health"></span></div><canvas id="game" width="960" height="540" aria-label="Stitchy game"></canvas><div id="controls" aria-label="Game controls"><button id="left" aria-label="Move left">◀</button><button id="jump" aria-label="Jump">▲ JUMP</button><button id="right" aria-label="Move right">▶</button><button id="fly" aria-label="Fly upward">✦ FLY</button></div><div id="settings"><button id="start">Start / Restart</button><button id="sound">Enable Music</button></div><small>Keyboard: A/D or arrows to move, Space/W/↑ to jump, F to fly after evolution. Touch: hold directional buttons. Collect glowing stitches; avoid red hazards. Damage costs stitches and can reverse evolution. Audio starts when enabled.</small></main><script>
const c=document.querySelector('#game'),x=c.getContext('2d');let keys={},player,stitches,hazards,particles,score,invuln,running=false,last=0,clock=0,audio=null,musicTimer=0,notes=0;
const names=['GENESIS · 1D','PIXEL AGE · 8-BIT','EXPANSION · 16-BIT','RENAISSANCE · 32-BIT','EMERGENCE · MODERN'];const thresholds=[0,4,10,19,31];let stage=0;
function reset(){player={x:65,y:460,vx:0,vy:0,r:13};stitches=[];hazards=[];particles=[];score=0;invuln=0;clock=0;stage=0;running=true;for(let i=0;i<11;i++)spawnStitch(i);for(let i=0;i<3;i++)spawnHazard(i);updateHud()}
function stitchHeight(){return stage===0?460:stage===1?320+Math.random()*140:110+Math.random()*350}function spawnStitch(i=0){stitches.push({x:130+Math.random()*760,y:stitchHeight(),r:9,phase:Math.random()*6})}function spawnHazard(i=0){hazards.push({x:230+Math.random()*680,y:stage===0?460:160+Math.random()*300,v:Math.random()<.5?-1:1,r:15})}
function updateHud(){stage=thresholds.reduce((a,t,i)=>score>=t?i:a,0);document.querySelector('#stage').textContent=names[stage];document.querySelector('#score').textContent='Stitches: '+score+' / 31';document.querySelector('#health').textContent=invuln>0?'Recovering…':stage>=1?'FLY unlocked • Hold to rise':'Collect • Evolve • Survive';document.querySelector('#fly').classList.toggle('available',stage>=1);if(stage===0){keys.f=false;keys.F=false;keys.Fly=false;for(const s of stitches)if(s.y<375)s.y=460}}
function beep(freq,dur=.12,type='square',volume=.06){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function music(dt){if(!audio||!running)return;musicTimer-=dt;if(musicTimer>0)return;let scales=[[220,0,0,0],[220,330,440,330],[220,277,330,440],[220,261.6,329.6,493.9],[220,329.6,440,554.4,659.3]],s=scales[stage];let f=s[notes%s.length];if(f)beep(f,stage>=3?.24:.11,stage>=3?'sine':stage===0?'square':'triangle',.027);if(stage>=2&&notes%4===0)beep(110,.25,'sine',.035);notes++;musicTimer=[.48,.28,.24,.22,.19][stage]}
function step(dt){if(!running)return;clock+=dt;invuln=Math.max(0,invuln-dt);let prev=stage;let dir=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0);player.vx=dir*(stage===0?190:240+stage*24);player.x=Math.max(20,Math.min(940,player.x+player.vx*dt));if((keys.ArrowUp||keys.w||keys.W||keys[' '])&&player.y>=459)player.vy=-365;if(stage>=1&&(keys.f||keys.F||keys.Fly)){player.vy=Math.max(-300,player.vy-1050*dt)}player.vy+=840*dt;player.y=Math.min(460,Math.max(55,player.y+player.vy*dt));if(player.y===460)player.vy=0
for(let s of stitches){s.phase+=dt*4;if(Math.hypot(s.x-player.x,s.y-player.y)<player.r+s.r+5){score++;beep(550+score*24,.15,'triangle',.07);s.x=130+Math.random()*780;s.y=stitchHeight();for(let j=0;j<9;j++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,t:.6})}}
for(let h of hazards){h.x+=h.v*(60+stage*18)*dt;if(h.x<30||h.x>930)h.v*=-1;if(stage===0)h.y=460;if(invuln<=0&&Math.hypot(h.x-player.x,h.y-player.y)<h.r+player.r){score=Math.max(0,score-3);invuln=1.6;player.x=Math.max(30,player.x-65);beep(105,.38,'sawtooth',.09)}}
if(stage!==prev){beep(660,.18,'sine',.08);setTimeout(()=>beep(880,.3,'sine',.08),140)}updateHud();particles=particles.filter(p=>p.t>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt});music(dt)}
function draw(){let palettes=[['#050505','#fff','#aaa'],['#12192e','#46df89','#79b8ff'],['#182a49','#ffcd70','#6cdecb'],['#182139','#e5a7ff','#78c6ff'],['#0a1830','#fff0b3','#9de6ff']],p=palettes[stage];x.fillStyle=p[0];x.fillRect(0,0,960,540);if(stage>=1){for(let i=0;i<35+stage*25;i++){let xx=(i*173+37)%960,yy=(i*97+11)%470;x.fillStyle=stage>=3?'#ffffff25':'#ffffff18';x.fillRect(xx,yy,stage>=3?2:5,stage>=3?2:5)}}if(stage>=2){for(let i=0;i<7;i++){let xx=i*180-(clock*(10+stage*10))%180;x.fillStyle=stage>=4?'#254d69':'#29395b';x.beginPath();x.moveTo(xx,460);x.lineTo(xx+90,280+Math.sin(i)*55);x.lineTo(xx+210,460);x.fill()}}x.fillStyle=stage===0?'#fff':'#314b5e';x.fillRect(0,482,960,stage===0?2:58);if(stage===0){x.fillStyle='#888';x.font='22px monospace';x.fillText('← MOVE →  •  JUMP ▲  •  COLLECT',245,70)}for(let s of stitches){let r=s.r+Math.sin(s.phase)*2;x.fillStyle=stage===0?'#fff':'#ffe68a';x.shadowColor=x.fillStyle;x.shadowBlur=stage===0?0:16;x.beginPath();x.arc(s.x,s.y,r,0,Math.PI*2);x.fill();x.shadowBlur=0}for(let h of hazards){x.fillStyle=stage===0?'#aaa':'#ff5e78';x.fillRect(h.x-14,h.y-14,28,28)}if(invuln<=0||Math.floor(clock*12)%2===0){x.fillStyle=p[1];if(stage===0){x.fillRect(player.x-9,player.y-9,18,18)}else if(stage===1){x.fillRect(player.x-12,player.y-14,24,28);x.fillStyle=p[2];x.fillRect(player.x-6,player.y-5,5,5)}else{x.shadowColor=p[1];x.shadowBlur=stage*5;x.beginPath();x.arc(player.x,player.y,player.r+stage*2,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#17223c';x.beginPath();x.arc(player.x+5,player.y-4,3,0,Math.PI*2);x.fill()}}particles.forEach(q=>{x.globalAlpha=Math.max(0,q.t/.6);x.fillStyle='#ffe68a';x.fillRect(q.x,q.y,4,4)});x.globalAlpha=1;x.fillStyle='#ffffffbb';x.font='16px system-ui';x.fillText('STITCHY · '+names[stage],18,30);if(score>=31){x.fillStyle='#ffffff';x.font='bold 36px system-ui';x.fillText('YOU HAVE EVOLVED!',300,100);x.font='18px system-ui';x.fillText('Keep collecting or restart to experience the journey again.',240,130)}}
function frame(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;step(dt);draw();requestAnimationFrame(frame)}document.querySelector('#start').onclick=reset;document.querySelector('#sound').onclick=()=>{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();document.querySelector('#sound').textContent='Music On';musicTimer=0};window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{keys={};document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('pressed'))});for(let [id,key] of [['left','ArrowLeft'],['right','ArrowRight'],['jump','ArrowUp'],['fly','Fly']]){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.classList.add('pressed');b.setPointerCapture(e.pointerId)});for(let event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>{keys[key]=false;b.classList.remove('pressed')})}reset();requestAnimationFrame(frame);
</script></body></html>
